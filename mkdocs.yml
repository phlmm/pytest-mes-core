site_name: Pytest MES Core
site_description: Enterprise MES framework core for hardware testing
site_author: Filip Milev

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - toc.integrate
  palette:
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          options:
            docstring_style: google
            show_root_heading: true
            show_source: true

nav:
  - Home: index.md
  - API Reference:
    - State Machine: api/state_machine.md
    - Plugins:
      - Orchestrator: api/plugins/orchestrator.md
      - Hardware: api/plugins/hardware.md
      - Manifest: api/plugins/manifest.md
      - Telemetry Hooks: api/plugins/telemetry_hooks.md
      - Core Config: api/plugins/core_config.md
    - Utils:
      - Daemon: api/utils/daemon.md
      - Process: api/utils/process.md
      - UART Parser: api/utils/uart_parser.md
    - Provisioning:
      - Block Device: api/provisioning/block_device.md
      - JTAG: api/provisioning/jtag.md
